<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Numora — Communications</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">N</div><div><strong>Numora</strong><span>Digital communications</span></div></div><div class="number-card"><span class="eyebrow">TEST INVENTORY</span><strong>2 SIM numbers</strong><span class="status"><i></i> SIM gateway prototype</span></div><div class="section-label">Test numbers</div><div id="devices" class="device-list"></div><div class="section-label">Channels</div><div class="channel-list"><span><i class="dot whatsapp"></i> WhatsApp</span><span><i class="dot sms"></i> SMS / SIM</span></div></aside><section class="chat"><header class="chat-header"><div><span class="avatar large">NS</span><div><strong>Numora Test Console</strong><span>SMS gateway + WhatsApp prototype</span></div></div><span class="connection"><i></i> Local</span></header><div class="toolbar"><div><strong>SIM gateway</strong><span>Test message routing before connecting real GSM hardware.</span></div><button id="simulateInbound" type="button">Simulate inbound SMS</button></div><div id="messages" class="messages"></div><form id="composer" class="composer"><select id="channel" aria-label="Channel"><option value="sms">SMS / SIM</option><option value="whatsapp">WhatsApp</option></select><select id="deviceId" aria-label="SIM device"></select><label class="field"><span>Recipient phone number</span><input id="phone" value="" inputmode="tel" autocomplete="tel" placeholder="0917 123 4567" aria-label="Recipient phone number" required><small>Philippine mobile numbers are accepted.</small></label><input id="message" autocomplete="off" placeholder="Type a message…" aria-label="Message"><button type="submit">Send</button></form></section></main><script src="/app.js"></script></body></html>
